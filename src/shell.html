<title>C&amp;C 나폴레오닉 솔로</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 야전 지휘소 탁자: 짙은 녹색 펠트 위에 종이 지도와 지휘카드. 왼쪽 지도, 오른쪽 지휘 패널 */
:root{
  --bg:#17221c; --felt:#1d2b23; --surface:#22332a; --surface-2:#2b3f34; --line:#3b5246; --line-2:#4c6658;
  --ink:#ece5d0; --ink-dim:#a9b5a6; --ink-faint:#7f8f80;
  --brass:#d6ad55; --brass-ink:#2b2210;
  --br:#c4362c; --fr:#3561c0; --pt:#8b5e34;
  --paper:#f1ead6; --paper-2:#e5dcc1; --paper-ink:#2a2620; --paper-dim:#6b6250;
  --good:#7fbf6a; --bad:#e2685c;
  --f-display:"Nanum Myeongjo","Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1200px 600px at 30% -10%,#24372d 0%,transparent 60%),var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
/* header */
.top{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mk{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;color:var(--brass-ink);background:var(--brass);padding:2px 7px;border-radius:3px}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand small{color:var(--ink-faint);font-size:12px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tabs button{background:none;border:1px solid transparent;border-radius:6px;padding:6px 12px;color:var(--ink-dim);cursor:pointer;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--line-2);background:var(--surface)}
.tabs button:hover{color:var(--ink)}
/* bar */
#bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px}
.scn{display:flex;align-items:center;gap:10px;min-width:0}
.scn-no,.pno{font-family:var(--f-display);font-weight:800;font-size:20px;width:34px;height:34px;display:grid;place-items:center;border:1.5px solid var(--brass);color:var(--brass);border-radius:50%;flex:none}
.scn b{font-family:var(--f-display);font-size:17px;display:block;line-height:1.2}
.scn small{color:var(--ink-faint);font-size:12px}
.vbs{display:flex;gap:10px;flex-wrap:wrap}
.vb{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}
.vb span:first-child{font-size:12px;color:var(--ink-dim)}
.vb b{font-family:var(--f-mono);font-size:15px;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:3px}
.pips i{width:10px;height:14px;clip-path:polygon(0 0,100% 0,100% 100%,50% 75%,0 100%);background:var(--line-2)}
.vb.side-B .pips i.on{background:var(--br)} .vb.side-F .pips i.on{background:var(--fr)}
.pips i.obj{background:var(--brass)}
.barbtns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.mode{display:inline-block;font-size:11px;color:var(--brass-ink);background:var(--brass);border-radius:3px;padding:0 6px;margin-right:4px;font-weight:700}
.who{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;border-radius:4px;padding:1px 8px;margin-bottom:6px}
.who.side-B{background:var(--br)} .who.side-F{background:var(--fr)}
.modesel{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.ph3{font-family:var(--f-display);font-size:15px;margin:14px 0 6px}
.sidesel{display:flex;gap:6px;margin-bottom:4px}
.sidesel button{flex:1;padding:8px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:700;cursor:pointer}
.sidesel button.side-B[aria-checked="true"]{border-color:var(--br);background:#4a2420}
.sidesel button.side-F[aria-checked="true"]{border-color:var(--fr);background:#1f2d52}
.neterr{color:#f0a59c;background:#3a2220;border:1px solid #7a3a33;border-radius:6px;padding:8px 10px;margin:0 0 8px}
.netbox{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line-2);border-radius:6px;padding:5px 10px}
.netbox.side-B{border-left-color:var(--br)} .netbox.side-F{border-left-color:var(--fr)}
.netbox .code{font-family:var(--f-mono);letter-spacing:.12em;color:var(--brass)}
.dot::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#8a8a7a;margin-right:5px;vertical-align:1px}
.dot.ok::before{background:var(--good)}
.mine{font-style:normal;font-size:12px;background:var(--brass);color:var(--brass-ink);border-radius:4px;padding:1px 7px;margin-left:6px;font-family:var(--f-body)}
.theirs{font-style:normal;font-size:12px;border:1px solid var(--line-2);color:var(--ink-dim);border-radius:4px;padding:1px 7px;margin-left:6px;font-family:var(--f-body)}
.prompt.wait{border-style:dashed}
.prompt.wait p{margin:0 0 6px}
code{font-family:var(--f-mono);font-size:.92em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.modesel button{text-align:left;background:var(--surface-2);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.modesel button[aria-checked="true"]{border-color:var(--brass);box-shadow:0 0 0 3px rgba(214,173,85,.15)}
.modesel b{display:block;font-family:var(--f-display);font-size:16px}
.modesel small{color:var(--ink-faint);font-size:12px}
@media (max-width:520px){.modesel{grid-template-columns:1fr}}
/* buttons */
.btn{border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--brass)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.ghost.on{border-color:var(--brass);color:var(--brass)}
.btn.small{padding:5px 9px;font-size:12px}
.btn.danger{border-color:#7a3a33;color:#f0a59c}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:minmax(0,1fr)}}
.boardwrap{min-width:0;background:var(--felt);border:1px solid var(--line);border-radius:10px;padding:10px;position:sticky;top:8px}
@media (max-width:1100px){.boardwrap{position:static}}
.boardscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
#board{display:block;width:100%;min-width:680px;height:auto;user-select:none;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--ink-dim)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.3)}
/* svg */
.hex{stroke:#9d927a;stroke-width:1;cursor:pointer}
.hex:hover{stroke:#3a3226;stroke-width:1.8}
.secline{stroke:#3a3226;stroke-width:1.6;stroke-dasharray:7 4 2 4;pointer-events:none}
.seclab{font:600 10.5px var(--f-body);fill:#4a4232;text-anchor:middle;pointer-events:none}
.bandname{font:700 10.5px var(--f-mono);fill:#fff;text-anchor:middle;letter-spacing:.1em;pointer-events:none}
.pname{font:italic 600 8.5px var(--f-body);fill:#2e2a20;text-anchor:middle;paint-order:stroke;stroke:#f1ead6;stroke-width:2.4px}
.unit,.leader{cursor:pointer}
.uab{font:700 11px var(--f-body);fill:#fff;text-anchor:middle;pointer-events:none}
.ubody{stroke:rgba(0,0,0,.35);stroke-width:1}
.unit.ordered .ubody{stroke:#f2c14e;stroke-width:3}
.unit.selected .ubody{stroke:#fff;stroke-width:3;stroke-dasharray:5 3}
.unit.ordered.selected .ubody{stroke:#fff}
.leader.selected polygon{stroke:#fff;stroke-width:3}
.sqtag,.sstag{font:700 8px var(--f-body);fill:#3a2f10;text-anchor:end;paint-order:stroke;stroke:#ffd84a;stroke-width:3px}
.sstag{text-anchor:middle;stroke:#f0a59c}
.mk{font:700 7.5px var(--f-mono);fill:#2b2210;text-anchor:middle;pointer-events:none}
.mk.w{fill:#fff}
.lname{font:700 9px var(--f-body);fill:#1f1b14;text-anchor:middle;paint-order:stroke;stroke:#f1ead6;stroke-width:3px;pointer-events:none}
.ov{pointer-events:all;cursor:pointer}
.ov-move{fill:rgba(70,160,80,.38);stroke:#2f7a3a;stroke-width:2}
.ov-melee{fill:rgba(220,50,40,.16);stroke:#d22b20;stroke-width:3.2}
.ov-fire{fill:rgba(40,90,200,.14);stroke:#2457c4;stroke-width:3;stroke-dasharray:6 3}
.ov-pick{fill:rgba(255,200,50,.33);stroke:#e0a000;stroke-width:3;animation:pulse 1.1s ease-in-out infinite}
.ov-elig{fill:rgba(242,193,78,.2);stroke:#c99a2e;stroke-width:1.6;pointer-events:none}
.ov-ready{fill:rgba(242,193,78,.16);stroke:#e0a63a;stroke-width:2;stroke-dasharray:3 3;pointer-events:none}
.fxtxt{font:800 15px var(--f-mono);stroke-width:3px;paint-order:stroke;pointer-events:none}
.ov-sel{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:5 3;pointer-events:none}
@keyframes pulse{50%{fill:rgba(255,200,50,.12)}}
/* side panel */
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.sidecol{display:flex;flex-direction:column;gap:12px;min-width:0}
.sidecol > .side{display:contents} .sidecol > .chat{order:1} .side > .logblock{order:2}
.chatlog{list-style:none;padding:0;margin:0 0 8px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.chatlog .cm{display:flex;gap:6px;align-items:baseline;padding:4px 8px;border-radius:6px;background:var(--surface-2);border-left:3px solid var(--line-2);overflow-wrap:anywhere}
.chatlog .cm.side-B{border-left-color:var(--br)} .chatlog .cm.side-F{border-left-color:var(--fr)}
.chatlog .cm.me{background:var(--felt)}
.chatlog .cm b{flex:none;font-size:12px;color:var(--ink-dim)}
.chatlog .cm span{flex:1;min-width:0}
.chatlog .cm time{flex:none;font-size:11px;color:var(--ink-faint);font-family:var(--f-mono)}
.chatlog .cm.empty{color:var(--ink-faint);border-left-color:transparent;background:none}
.chatform{margin:0}
.block,.turn,.prompt{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.block h3,.prompt h3{font-family:var(--f-display);font-size:15px;margin:0 0 8px;font-weight:800}
.block h3 small{font-family:var(--f-body);color:var(--ink-faint);font-weight:500;font-size:12px;margin-left:6px}
.block h4{font-size:12px;letter-spacing:.06em;color:var(--ink-dim);margin:14px 0 6px;font-weight:600}
.turn{border-left:5px solid var(--line-2)}
.turn.side-B{border-left-color:var(--br)} .turn.side-F{border-left-color:var(--fr)}
.turn-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tnum{font-family:var(--f-mono);color:var(--ink-faint);font-size:12px}
.tside{font-family:var(--f-display);font-weight:800;font-size:19px}
.tcmd{margin-left:auto;font-size:12px;color:var(--ink-dim)}
.phases{display:flex;flex-wrap:wrap;gap:4px;list-style:none;padding:0;margin:10px 0 8px}
.phases li{font-size:11.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink-faint)}
.phases li.done{color:var(--ink-dim);border-color:var(--line-2)}
.phases li.now{background:var(--brass);border-color:var(--brass);color:var(--brass-ink);font-weight:700}
.help{margin:0 0 10px;color:var(--ink-dim);font-size:13px}
.help b{color:var(--ink)}
.actions,.pbtns,.sbtns{display:flex;flex-wrap:wrap;gap:6px}
.prompt{border:1.5px solid var(--brass);background:#2e3a2a;box-shadow:0 0 0 4px rgba(214,173,85,.12)}
.prompt.pick p{margin:0 0 8px;font-weight:600}
.pbody{font-size:13px;color:var(--ink);margin-bottom:10px}
.pbody small{color:var(--ink-dim);display:block;margin-top:6px;line-height:1.5}
.toggles{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tog{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer;background:var(--surface-2);padding:6px 8px;border-radius:6px}
.dec-row{margin-bottom:6px}
.parts{list-style:none;padding:0;margin:0 0 6px;border-top:1px solid var(--line)}
.parts li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-dim)}
.pv{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.pv.neg{color:var(--bad)}
.dec-total{font-size:13px}
.dec-total b{font-family:var(--f-mono);font-size:16px;color:var(--brass)}
.osum{margin:8px 0 0;font-size:12.5px;color:var(--brass)}
.note{font-size:12px;color:var(--ink-faint);margin:8px 0 0}
/* command cards: 종이 카드 */
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ccard{display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:2px;background:var(--paper);color:var(--paper-ink);border:1px solid #bdb194;border-radius:8px;padding:8px 9px 9px;cursor:pointer;position:relative;width:100%;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;border-radius:8px 8px 0 0;background:#6f7d46}
.ccard.tac::before{background:#7c2f3a}
.ccard.pre{outline:2px dashed #b4473a;outline-offset:-4px}
.ccard.sel{box-shadow:0 0 0 3px var(--brass),0 2px 0 rgba(0,0,0,.25);transform:translateY(-2px)}
.ccard.dis{opacity:.55;cursor:default}
.ccard:not(.dis):hover{border-color:#8a7a52}
.cc-kind{font-size:10px;letter-spacing:.06em;color:var(--paper-dim);margin-top:2px}
.cc-name{font-family:var(--f-display);font-weight:800;font-size:15.5px;line-height:1.2}
.cc-en{font-family:var(--f-mono);font-size:9.5px;color:var(--paper-dim);text-transform:uppercase;letter-spacing:.04em}
.cc-sec{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin:5px 0 2px}
.cc-sec span{font-size:10px;text-align:center;border:1px solid #c9bd9c;border-radius:4px;padding:2px 0;color:#9b917a;background:#ebe3cc}
.cc-sec span b{display:block;font-family:var(--f-mono);font-size:13px;color:#b5ab90}
.cc-sec span.on{background:#6f7d46;border-color:#6f7d46;color:#eef0dc}
.cc-sec span.on b{color:#fff}
.cc-text{font-size:11.5px;line-height:1.45;color:#4a4436;margin-top:3px}
.block > .ccard{cursor:default}
.facedown{display:flex;gap:6px}
.fd{width:46px;height:64px;border-radius:6px;background:repeating-linear-gradient(45deg,#2c4236 0 6px,#26392f 6px 12px);border:1px solid var(--line-2)}
/* dice */
.dice{display:flex;flex-wrap:wrap;gap:6px}
.die{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.die em{font-style:normal;font-size:10px;color:var(--ink-dim)}
.dice.rolling .die svg{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6);opacity:.3}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.dice.rolling .die svg,.ov-pick{animation:none}}
.dlabel{font-size:12.5px;margin:0 0 8px;color:var(--ink-dim)}
.dnote{margin:8px 0 0;font-weight:700;color:var(--brass)}
/* selection */
.ui-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--ink-dim)}
.chip{color:#fff;font-weight:700;font-size:12px;padding:2px 8px;border-radius:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin:10px 0 0}
.stats div{background:var(--surface-2);border-radius:6px;padding:5px 8px}
.stats dt{font-size:10.5px;color:var(--ink-faint)}
.stats dd{margin:0;font-size:12.5px;font-weight:600}
.sbtns{margin-top:10px}
/* log */
.log{list-style:none;padding:0;margin:0;max-height:300px;overflow:auto;font-size:12px}
.lg{padding:4px 0;border-bottom:1px solid var(--line);color:var(--ink-dim);display:flex;gap:8px}
.lt{font-family:var(--f-mono);color:var(--ink-faint);min-width:20px;text-align:right}
.lg.vb{color:var(--brass)} .lg.warn{color:#f0b2a8} .lg.win{color:var(--brass);font-weight:700}
.lg.card{color:var(--ink)} .lg.sys{color:var(--ink-faint);font-style:italic} .lg.hit{color:#f0c9a8}
/* edit */
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chipbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;border:1px solid var(--line-2);background:var(--surface-2);border-radius:20px;padding:4px 9px;cursor:pointer}
.chipbtn i{width:11px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.4)}
.chipbtn.on{border-color:var(--brass);color:var(--brass)}
.addrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.addrow select,.addrow input{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2);border-radius:6px;padding:5px 8px;font:inherit;font-size:12.5px;min-width:0;flex:1 1 140px}
.vbedit{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;margin-right:10px}
/* overlay */
#overlay .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);padding:9px 16px;border-radius:8px;font-weight:600;font-size:13px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px)}
.win{position:fixed;inset:0;background:rgba(10,16,12,.72);display:grid;place-items:center;z-index:40;padding:16px}
.wincard,.picker{background:var(--surface);border:1px solid var(--line-2);border-radius:14px;padding:26px;max-width:520px;width:100%;text-align:center}
.wincard{border-top:8px solid var(--brass)} .wincard.side-B{border-top-color:var(--br)} .wincard.side-F{border-top-color:var(--fr)}
.wk{font-family:var(--f-mono);letter-spacing:.3em;color:var(--brass);margin:0}
.wincard h2{font-family:var(--f-display);font-size:40px;margin:6px 0}
.wincard .pbtns{justify-content:center;margin-top:16px}
.picker{text-align:left;max-height:86vh;overflow:auto;max-width:640px}
.picker h2{font-family:var(--f-display);margin:0 0 12px}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pitem{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.pitem:hover{border-color:var(--brass)}
.pitem b{display:block;font-family:var(--f-display);font-size:15px}
.pitem small{color:var(--ink-faint);font-size:12px}
.pitem .pno{width:28px;height:28px;font-size:15px}
/* docs */
.doc{max-width:900px;margin:0 auto;padding-block:20px}
.doc h2{font-family:var(--f-display);font-size:28px;margin:10px 0 6px;font-weight:800;text-wrap:balance}
.doc .lede{color:var(--ink-dim);font-size:15px;max-width:68ch;margin:0 0 20px}
.doc h3{font-family:var(--f-display);font-size:19px;margin:30px 0 8px;padding-top:14px;border-top:1px solid var(--line);font-weight:800}
.doc h4{font-size:14px;margin:18px 0 6px;color:var(--brass)}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:3px 0}
.doc b,.doc strong{color:#fff7e2}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.toc a{font-size:12.5px;color:var(--ink-dim);text-decoration:none;border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.toc a:hover{color:var(--brass);border-color:var(--brass)}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:8px}
.doc table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.doc th,.doc td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.doc th,.doc td:first-child{white-space:nowrap}
.doc td.w{white-space:normal;min-width:180px}
.doc th{background:var(--surface-2);font-weight:600;color:var(--ink-dim);font-size:11.5px}
.doc tr.grp td{background:var(--surface);color:var(--brass);font-weight:700}
.callout{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;margin:12px 0}
.callout p{margin:4px 0}
.steps{counter-reset:s;list-style:none;padding:0}
.steps>li{counter-increment:s;position:relative;padding:10px 12px 10px 48px;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:8px 0}
.steps>li::before{content:counter(s);position:absolute;left:12px;top:10px;width:26px;height:26px;border-radius:50%;background:var(--brass);color:var(--brass-ink);font-weight:800;display:grid;place-items:center;font-family:var(--f-mono)}
.facesrow{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.facesrow span{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
#scenlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:14px}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.scard header{display:flex;gap:10px;align-items:center}
.scard h3{font-family:var(--f-display);margin:0;font-size:16px;line-height:1.25;border:0;padding:0}
.sdate{margin:0;font-size:12px;color:var(--ink-faint)}
.shist{margin:0;font-size:13px;color:var(--ink-dim)}
.snotes{margin:0;display:grid;gap:3px;font-size:12.5px}
.snotes div{display:flex;gap:8px}
.snotes dt{color:var(--ink-faint);min-width:52px}
.snotes dd{margin:0}
.srules{margin:0;padding-left:18px;font-size:12.5px;color:var(--ink-dim)}
.scard .btn{align-self:flex-start;margin-top:auto}
@media (max-width:600px){.brand h1{font-size:19px}.tabs{margin-left:0}.doc h2{font-size:23px}.barbtns{margin-left:0}}
</style>
